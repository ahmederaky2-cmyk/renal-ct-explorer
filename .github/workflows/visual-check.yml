name: visual-check

# Screenshots of the real app on public KiTS23 cases, at demo and full resolution.
# Output: workflow artifact "screenshots" and the orphan branch "visual-results".
on:
  workflow_dispatch:
  push:
    branches: [visual-check]

permissions:
  contents: write

concurrency:
  group: visual-check
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CASES: "case_00015 case_00000 case_00050 case_00005 case_00122"
      RENAL_DEMO_CACHE: /tmp/kits
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install app and browser
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Download cases
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from renal_explorer.remote_data import ensure_demo_case
          for case in os.environ["CASES"].split():
              ensure_demo_case(case, Path(os.environ["RENAL_DEMO_CACHE"]))
              print("ok", case)
          PY
      - name: Demo resolution (as on the public site)
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > demo.log 2>&1 &
          sleep 15
          python scripts/visual/visual_check.py --url http://localhost:8501 --out shots \
            --prefix demo_ --cases $CASES --mobile-case case_00015
          kill %1 || true
      - name: Full resolution (server dataset mode)
        env:
          RENAL_DATA_ROOT: /tmp/kits
        run: |
          streamlit run app.py --server.headless true --server.port 8502 > full.log 2>&1 &
          sleep 15
          python scripts/visual/visual_check.py --url http://localhost:8502 --out shots \
            --prefix full_ --cases $CASES
          kill %1 || true
      - name: Logs
        if: always()
        run: |
          mkdir -p shots
          cp demo.log full.log shots/ 2>/dev/null || true
          tail -50 demo.log full.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
      - name: Publish to visual-results branch
        if: always()
        run: |
          cd shots
          git init -q
          git checkout -q -b visual-results
          git add -A
          git -c user.name="visual-check" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" \
            visual-results
